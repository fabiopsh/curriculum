name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/portfolio-website-p8ay13
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; le richieste in coda vengono sostituite dall'ultima.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # Richiede che Pages sia già attivo sulla repository con sorgente
      # "GitHub Actions" (Settings -> Pages -> Build and deployment -> Source).
      # È un passaggio manuale una tantum: GITHUB_TOKEN non può creare il sito
      # Pages da solo, perché l'operazione richiede permessi di amministrazione
      # che il blocco `permissions:` di un workflow non può concedere.
      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica l'artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
