<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Diagnostica — curriculum</title>
    <style>
      body {
        margin: 0;
        padding: 20px 16px 60px;
        font: 15px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        background: #fff;
        color: #111;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      p.sub { margin: 0 0 20px; color: #666; font-size: 13px; }
      .r { border-top: 1px solid #ddd; padding: 12px 0; }
      .k { color: #666; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
      .v { font-size: 15px; word-break: break-all; margin-top: 3px; }
      .ok { color: #0a6b2d; font-weight: 700; }
      .no { color: #b3261e; font-weight: 700; }
      .verdetto { margin-top: 24px; padding: 14px; border: 2px solid #111; font-size: 15px; }
    </style>
  </head>
  <body>
    <h1>Diagnostica del sito</h1>
    <p class="sub">
      Questa pagina non usa React, non carica il bundle e non dipende da file esterni.
      Se la stai leggendo, GitHub Pages sta servendo correttamente questa cartella.
    </p>

    <div id="out"><div class="r"><div class="v">Controlli in corso…</div></div></div>
    <div id="verdetto"></div>

    <script>
      /* Sintassi volutamente ES5: questa pagina deve poter girare anche dove il
         bundle dell'applicazione non riesce a essere interpretato. */
      var out = document.getElementById('out')
      var righe = []

      function aggiungi(chiave, valore, stato) {
        var classe = stato === true ? 'ok' : stato === false ? 'no' : ''
        righe.push(
          '<div class="r"><div class="k">' + chiave + '</div><div class="v ' + classe + '">' + valore + '</div></div>'
        )
        out.innerHTML = righe.join('')
      }

      function testo(risposta) {
        return risposta.text().then(function (t) {
          return { stato: risposta.status, testo: t, headers: risposta.headers }
        })
      }

      aggiungi('Indirizzo di questa pagina', location.href)
      aggiungi('Browser', navigator.userAgent)

      var haContenuto = null
      var haContenutoCache = null

      /* 1. Cosa ha davvero il server adesso, ignorando la cache locale. */
      fetch('./?diagnostica=' + Date.now(), { cache: 'no-store' })
        .then(testo)
        .then(function (r) {
          aggiungi('index.html dal server — stato HTTP', r.stato, r.stato === 200)
          haContenuto = r.testo.indexOf('Fabio Piscitelli') !== -1
          aggiungi(
            'index.html dal server — contiene il curriculum',
            haContenuto ? 'SI (' + r.testo.length + ' byte)' : 'NO (' + r.testo.length + ' byte)',
            haContenuto
          )
          aggiungi('Header age', r.headers.get('age') || '(assente)')
          aggiungi('Header cache-control', r.headers.get('cache-control') || '(assente)')

          /* 2. I file che quell'HTML richiede esistono? */
          var js = r.testo.match(/src="([^"]*assets\/[^"]*\.js)"/)
          var css = r.testo.match(/href="([^"]*assets\/[^"]*\.css)"/)
          var attese = []

          if (js) {
            attese.push(
              fetch(js[1], { cache: 'no-store' }).then(function (x) {
                aggiungi('Bundle JS — ' + js[1].split('/').pop(), 'HTTP ' + x.status, x.status === 200)
              })
            )
          } else {
            aggiungi('Bundle JS', 'nessun riferimento trovato nell HTML', false)
          }

          if (css) {
            attese.push(
              fetch(css[1], { cache: 'no-store' }).then(function (x) {
                aggiungi('Foglio di stile — ' + css[1].split('/').pop(), 'HTTP ' + x.status, x.status === 200)
              })
            )
          } else {
            aggiungi('Foglio di stile', 'nessun riferimento trovato nell HTML', false)
          }

          return Promise.all(attese)
        })
        /* 3. E cosa darebbe invece la cache del browser? */
        .then(function () {
          return fetch('./').then(testo)
        })
        .then(function (r) {
          haContenutoCache = r.testo.indexOf('Fabio Piscitelli') !== -1
          aggiungi(
            'index.html dalla cache del browser — contiene il curriculum',
            haContenutoCache ? 'SI' : 'NO',
            haContenutoCache
          )

          var v = document.getElementById('verdetto')
          var messaggio

          if (!haContenuto) {
            messaggio =
              'GitHub Pages NON sta servendo il contenuto: il problema e sul deploy, non sul tuo telefono.'
          } else if (!haContenutoCache) {
            messaggio =
              'Il server ha il contenuto giusto, ma il tuo browser ti sta dando una copia vecchia dalla cache. ' +
              'Apri il sito con ?v=2 in fondo all indirizzo, oppure in scheda privata.'
          } else {
            messaggio =
              'Server e cache hanno entrambi il contenuto corretto: la pagina bianca non puo venire da qui. ' +
              'Fai uno screenshot di questa pagina.'
          }

          v.innerHTML = '<div class="verdetto"><b>Verdetto</b><br>' + messaggio + '</div>'
        })
        .catch(function (e) {
          aggiungi('Errore durante i controlli', String(e && e.message ? e.message : e), false)
        })

      window.onerror = function (m) {
        aggiungi('Errore JavaScript in questa pagina', String(m), false)
      }
    </script>
  </body>
</html>
