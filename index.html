    <!-- Eseguito prima del primo paint, in sintassi che interpreta qualsiasi browser.
         Due compiti: applicare il tema salvato senza lampo di colore, e dichiarare
         che JS e' vivo. Il CSS nasconde il contenuto da animare solo se trova
         data-motion="on": senza questo flag la pagina resta leggibile in ogni caso. -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var saved = localStorage.getItem('fp-theme')
          if (saved !== 'light' && saved !== 'dark') {
            saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          root.setAttribute('data-theme', saved)
        } catch (_) {
          /* storage non disponibile: resta il tema chiaro di default */
        }
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.setAttribute('data-motion', 'on')
          }
        } catch (_) {
          /* senza il flag non si anima nulla, e va bene cosi' */
        }
      })()
    </script>
  </head>
  <body>
    <!-- Il contenuto del curriculum viene iniettato qui in fase di build da
         scripts/prerender.mjs, cosi' la pagina e' leggibile anche senza JavaScript.
         Il client non idrata questo markup: lo rimpiazza al montaggio. -->
    <div id="root"></div>

    <!-- Senza JavaScript il selettore del tema non puo' funzionare: meglio non mostrarlo. -->
    <noscript><style>[data-needs-js] { display: none !important; }</style></noscript>

    <script type="module" src="/src/main.tsx"></script>
  </body>
