    <style>
      /* Ricaduta mostrata solo se l'applicazione non arriva a montare. */

    <!-- Eseguito prima del primo paint, in sintassi che interpreta qualsiasi browser.
         Due compiti: applicare il tema salvato senza lampo di colore, e dichiarare
         che JS e' vivo. Il CSS nasconde il contenuto da animare solo se trova
         data-motion="on": senza questo flag la pagina resta leggibile in ogni caso. -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var saved = localStorage.getItem('fp-theme')
          if (saved !== 'light' && saved !== 'dark') {
            saved = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          root.setAttribute('data-theme', saved)
        } catch (_) {
          /* storage non disponibile: resta il tema chiaro di default */
        }
        try {
          if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
            root.setAttribute('data-motion', 'on')
          }
        } catch (_) {
          /* senza il flag non si anima nulla, e va bene cosi' */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Visibile solo se JS e' disattivato, oppure se il bundle non riesce a
         montare l'applicazione (browser troppo vecchio, errore di rete). Meglio
         un contatto raggiungibile che una pagina bianca. -->
    <div id="fallback" hidden>

    </div>
    <noscript><style>#fallback { display: block !important; }</style></noscript>

    <script type="module" src="/src/main.tsx"></script>
    <script>
      setTimeout(function () {
        var root = document.getElementById('root')
        var fallback = document.getElementById('fallback')
        if (root && fallback && root.children.length === 0) {
          fallback.hidden = false
        }
      }, 4000)
    </script>
